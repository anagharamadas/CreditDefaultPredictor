<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img">
  <title>Feature pipeline flow</title>
  <desc>Training path (raw CSV, typed ingest, vintage split) and serving path (JSON request, rebuilt frame) converge into one shared pipeline that derives dates, imputes numerics and one-hot encodes categoricals, producing the 155-number model matrix.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
  </style>
  <rect x="0" y="0" width="680" height="520" fill="#ffffff"/>

  <rect x="40" y="50" width="150" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text class="th" x="115" y="72" text-anchor="middle" fill="#085041">Raw loan file</text>
  <text class="ts" x="115" y="90" text-anchor="middle" fill="#0F6E56">2.26M rows · DVC</text>

  <rect x="230" y="50" width="150" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text class="th" x="305" y="72" text-anchor="middle" fill="#085041">Typed ingest</text>
  <text class="ts" x="305" y="90" text-anchor="middle" fill="#0F6E56">84 audited columns</text>

  <rect x="420" y="50" width="170" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text class="th" x="505" y="72" text-anchor="middle" fill="#085041">Vintage split</text>
  <text class="ts" x="505" y="90" text-anchor="middle" fill="#0F6E56">train rows 2013–2015</text>

  <rect x="40" y="150" width="155" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text class="th" x="117" y="172" text-anchor="middle" fill="#712B13">Loan application</text>
  <text class="ts" x="117" y="190" text-anchor="middle" fill="#993C1D">JSON over the wire</text>

  <rect x="230" y="150" width="170" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text class="th" x="315" y="172" text-anchor="middle" fill="#712B13">Rebuild frame</text>
  <text class="ts" x="315" y="190" text-anchor="middle" fill="#993C1D">ingest dtype policy</text>

  <line x1="190" y1="76" x2="226" y2="76" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="76" x2="416" y2="76" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="195" y1="176" x2="226" y2="176" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="102" x2="505" y2="236" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="315" y1="202" x2="315" y2="236" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="240" width="600" height="122" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text class="th" x="340" y="266" text-anchor="middle" fill="#2C2C2A">The one pipeline (features/pipeline.py)</text>

  <rect x="55" y="290" width="175" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text class="th" x="142" y="312" text-anchor="middle" fill="#3C3489">Derive dates</text>
  <text class="ts" x="142" y="330" text-anchor="middle" fill="#534AB7">credit_history_months</text>

  <rect x="255" y="290" width="170" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text class="th" x="340" y="312" text-anchor="middle" fill="#3C3489">Impute numerics</text>
  <text class="ts" x="340" y="330" text-anchor="middle" fill="#534AB7">train-window medians</text>

  <rect x="450" y="290" width="175" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text class="th" x="537" y="312" text-anchor="middle" fill="#3C3489">One-hot categories</text>
  <text class="ts" x="537" y="330" text-anchor="middle" fill="#534AB7">unknown value → zeros</text>

  <line x1="230" y1="318" x2="251" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="425" y1="318" x2="446" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="362" x2="340" y2="406" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="410" width="180" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text class="th" x="340" y="432" text-anchor="middle" fill="#2C2C2A">Model matrix</text>
  <text class="ts" x="340" y="450" text-anchor="middle" fill="#5F5E5A">155 numbers per loan</text>

  <rect x="60" y="496" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text class="ts" x="78" y="505" fill="#5F5E5A">training-time path</text>
  <rect x="230" y="496" width="10" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text class="ts" x="248" y="505" fill="#5F5E5A">serving-time path</text>
  <rect x="400" y="496" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text class="ts" x="418" y="505" fill="#5F5E5A">same code, both paths</text>
</svg>
