[project]
name = "credit-default-predictor"
version = "0.1.0"
description = "MLOps-first credit default granting model on LendingClub data. See CHARTER.md."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.15.1",
    "pandas>=2.3.3",
    "pandera>=0.32.1",
    "prefect>=3.8.3",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "realdata: needs the local interim parquet; CI runs `-m 'not realdata'`",
    "services: needs local docker compose services (mlflow, later postgres)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
